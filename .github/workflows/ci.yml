name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }}${{ matrix.name-suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24
            partition: ""
            name-suffix: ""
          - os: ubuntu-latest
            node-version: 26
            partition: ""
            name-suffix: ""
          - os: macos-latest
            node-version: 24
            partition: ""
            name-suffix: ""
          - os: macos-latest
            node-version: 26
            partition: ""
            name-suffix: ""
          - os: windows-latest
            node-version: 24
            partition: A
            name-suffix: ", Group A"
          - os: windows-latest
            node-version: 24
            partition: B
            name-suffix: ", Group B"
          - os: windows-latest
            node-version: 26
            partition: A
            name-suffix: ", Group A"
          - os: windows-latest
            node-version: 26
            partition: B
            name-suffix: ", Group B"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TS/JS synchronization (PostgreSQL pilot)
        run: npm run verify:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack and verify package contents
        run: |
          npm pack --ignore-scripts > pack.log
          TARBALL=$(tail -n 1 pack.log)
          echo "Tarball generado: $TARBALL"
          tar -tf "$TARBALL"
          if tar -tf "$TARBALL" | grep -E '^package/(src|tests|scripts|\.agents)/'; then
            echo "El tarball contiene archivos que no deben publicarse"
            exit 1
          fi

      - name: Check for relevant changes
        id: filter
        run: |
          # Regla 1: En ejecuciones manuales (workflow_dispatch) o tags de publicación -> verificar siempre
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Ejecución manual o tag de publicación: verificación activada."
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Regla 2: Determinar commit base para el diff
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          fi

          # Si no hay BASE identificable, intentar comparar contra HEAD~1
          if [ -z "$BASE" ]; then
            BASE="HEAD~1"
          fi

          # Obtener archivos modificados
          CHANGED_FILES=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo "FALLBACK")

          # Regla 3: Si no se puede determinar el diff o viene vacío, ejecutar por precaución (fail-safe)
          if [ "$CHANGED_FILES" = "FALLBACK" ] || [ -z "$CHANGED_FILES" ]; then
            echo "No se pudo determinar el diff con certeza. Verificación activada por precaución."
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Archivos modificados detectados:"
          echo "$CHANGED_FILES"

          # Regla 4: Verificar si hay cambios en código, plantillas, scripts, dependencias, configs o CI
          RELEVANT_PATTERN='^(src/|scripts/|\.github/|package\.json|package-lock\.json|tsconfig.*\.json|\.node-version|\.gitattributes|\.gitignore|eslint\.config\.js|vitest\.config\.ts)'
          if echo "$CHANGED_FILES" | grep -qE "$RELEVANT_PATTERN"; then
            echo "Cambios relevantes detectados: verificación activada."
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cambios exclusivamente documentales o ajenos al generador: omitiendo verify:generated."
            echo "run_verify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated functionality (portable)
        if: steps.filter.outputs.run_verify == 'true'
        run: VERIFY_SCOPE=portable npm run verify:generated:functional
        env:
          VERIFY_PARTITION: ${{ matrix.partition }}

      - name: Audit generated dependencies (portable, strict)
        if: ${{ !cancelled() && steps.filter.outputs.run_verify == 'true' }}
        run: VERIFY_SCOPE=portable npm run verify:generated:audit
        env:
          VERIFY_PARTITION: ${{ matrix.partition }}

  verify-full:
    name: Verify Generated Projects (Full Scope with Docker & PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated functionality (full)
        run: VERIFY_SCOPE=full npm run verify:generated:functional

      - name: Audit generated dependencies (full, strict)
        if: ${{ !cancelled() }}
        run: VERIFY_SCOPE=full npm run verify:generated:audit
