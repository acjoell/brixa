services:
  backend:
    environment:
      NODE_ENV: production
      AUTH_PUBLIC_ORIGIN: "${AUTH_PUBLIC_ORIGIN:?Indica el origen HTTPS sin barra final}"
      ACTIVATION_PAGE_URL: "${AUTH_PUBLIC_ORIGIN:?Indica el origen HTTPS sin barra final}/activate"
      AUTH_TRUSTED_PROXIES: "${TLS_NGINX_IP:?Configura TLS_NGINX_IP}"

  frontend:
    ports: !override
      - "127.0.0.1:${TLS_PORT:-8443}:8443"
    networks:
      default:
        ipv4_address: "${TLS_NGINX_IP:?Configura TLS_NGINX_IP}"
    volumes:
      - type: bind
        source: ./frontend/nginx.tls.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TLS_CERT_PATH:?Indica la ruta al certificado TLS}"
        target: /etc/nginx/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TLS_KEY_PATH:?Indica la ruta a la clave TLS}"
        target: /etc/nginx/tls.key
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: "${TLS_SUBNET:-172.30.240.0/28}"
          ip_range: "${TLS_DYNAMIC_RANGE:-172.30.240.8/29}"
